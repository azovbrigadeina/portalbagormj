name: Sync Portal Apps from Google Sheets

on:
  schedule:
    # Jalan otomatis setiap hari pukul 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync apps from Google Sheets
        run: node scripts/sync-sheets.mjs

      - name: Commit and push changes if any
        run: |
          if git diff --quiet index.html sitemap.xml; then
            echo "Tidak ada perubahan pada index.html atau sitemap.xml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "chore: sync portal apps from Google Sheets"
          git push
